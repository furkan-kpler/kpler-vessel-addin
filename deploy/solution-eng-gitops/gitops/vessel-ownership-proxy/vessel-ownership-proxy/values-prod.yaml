# yaml-language-server: $schema=https://kp-helmchart-stable-shared-main.s3.eu-west-1.amazonaws.com/schema/platform-managed-chart/v0.1.172/schema-platform-managed-chart.json

platform-managed-chart:
  env: prod

  api:
    replicas: 2
    resources:
      cpu: 500m
      memory: 512Mi
      limits:
        cpu: 500m
        memory: 512Mi
    env:
      # TODO(team): production add-in origin. Must be a Kpler-owned host (not github.io).
      ALLOWED_ORIGINS:
        value: "https://TODO-addin-host.kpler.com"
